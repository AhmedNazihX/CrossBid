# Local development stack: Postgres with pgvector, the API, the web app.
#
# This Postgres is for tests and offline work. Dev and demo point at the hosted Supabase EU
# project instead (see docs/project-plan.md, "Environments") because Auth and Storage are not
# mocked locally. Set DATABASE_URL in ../.env to choose.
#
#   cp infra/.env.example .env && docker compose -f infra/docker-compose.yml up
#
# Run from the repository root so the build contexts below resolve.

name: crossbid

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crossbid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossbid}
      POSTGRES_DB: ${POSTGRES_DB:-crossbid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Enables the `vector` extension on first boot of an empty volume.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossbid} -d ${POSTGRES_DB:-crossbid}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      # Compose-internal DSN, used when DATABASE_URL in .env is blank. Set it to the Supabase
      # DSN to point the stack at the hosted project (direct connection locally, session
      # pooler in deployment, never the transaction pooler). Do NOT set it to the host's
      # `localhost:5432` value: inside this container that is the container itself, and the
      # API refuses to start on an unreachable database (S0.2.2).
      DATABASE_URL: ${DATABASE_URL:-postgresql://crossbid:crossbid@db:5432/crossbid}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-company-documents}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-600}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      DEVELOPER_EMAILS: ${DEVELOPER_EMAILS:-}
      AUTH_MODE: ${AUTH_MODE:-dev}
      ENV: ${ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Build args, not `environment`: Next.js inlines NEXT_PUBLIC_* into the client
      # bundle at build time, so runtime values would be silently ignored. Changing one
      # of these requires a rebuild (`make build`), not just a restart.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Derived from AUTH_MODE so the browser cannot end up in a different mode from the
        # API it talks to: one variable in .env moves both halves (S4.1.1).
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-dev}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_DEV_COMPANY_ID: ${NEXT_PUBLIC_DEV_COMPANY_ID:-}
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
