# Story S0.1.4 — lint, type checks, tests with coverage, and generated-file checks.
# One job per app, plus a repo-wide job for the generated manifest, so a failure names the
# app that broke.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let a real key reach CI. Startup validation only checks that these are present.
  OPENROUTER_API_KEY: ci-placeholder-not-a-real-key
  APP_ENCRYPTION_KEY: ci-placeholder-not-a-real-key
  AUTH_MODE: dev
  ENV: test

jobs:
  backend:
    name: backend (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # pgvector image, not plain postgres: the schema declares `vector(1536)` columns, so
      # a plain postgres cannot even run the migrations.
      #
      # This service went unused for three increments. Every test that would have touched it
      # was marked `live` and deselected, so the offline suite reported 100 % coverage while
      # no statement in `crossbid/readmodel/` had ever been parsed by a database (audit,
      # 2026-09-15). The `database` marker is the fix: tests that need Postgres and spend no
      # money, run on every push by the step below.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crossbid
          POSTGRES_PASSWORD: crossbid
          POSTGRES_DB: crossbid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossbid -d crossbid_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: pytest with coverage
        env:
          DATABASE_URL: postgresql://crossbid:crossbid@localhost:5432/crossbid_test
        # The gate is 80% line coverage on crossbid/ (S0.1.4). --cov-report=term-missing
        # lists the uncovered files, which the story asks for on failure.
        run: >-
          uv run pytest
          --cov=crossbid
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      # Everything above this line ran without a database. These two steps are the only
      # place the SQL is executed rather than inspected as a string.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://crossbid:crossbid@localhost:5432/crossbid_test
        run: uv run python scripts/migrate.py

      - name: pytest (needs Postgres, spends nothing)
        env:
          DATABASE_URL: postgresql://crossbid:crossbid@localhost:5432/crossbid_test
        # No coverage: the gate above already measured it, and these tests exist to prove the
        # statements parse and the tenant predicate holds against a real engine, not to add
        # covered lines. `-m database` overrides the `-m 'not live'` in `addopts`.
        run: uv run pytest -m database --no-cov -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint, tsc, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: prettier
        run: npm run format:check

      - name: tsc --noEmit
        run: npm run typecheck

      # The frontend had no tests at all until 2026-09-16, across eighteen thousand lines,
      # which a 16-part audit named as one of its two largest findings. These are the jsdom
      # half: pure logic and component branches where a wrong answer is silent. They cannot
      # see layout or real CSS -- the `e2e` job below is what covers that.
      - name: vitest
        run: npm test

      - name: build
        run: npm run build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Three of the four blockers a 16-part audit found on 2026-09-15 were invisible to every
    # other job here: a data-flow gap between two sibling components, a colour utility naming
    # a token the theme does not declare (which yields no declaration at all rather than an
    # error), and a flex child collapsing to 2 px. A type checker cannot see any of them.
    # Only a real browser can, which is what this job is.
    #
    # No database and no API. The suite claims the API origin at the browser's network edge
    # and answers from fixtures typed against `lib/api.ts`, so a renamed field breaks it at
    # `tsc` rather than silently passing -- and a run costs nothing, reaches no hosted
    # project, and cannot spend money on a model.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only: the suite pins one browser, and downloading three would triple the
      # slowest step in this workflow for no extra signal.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: playwright
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  generated-files:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # dependencies.txt is generated from both lock files and must never be hand-edited,
      # so CI fails when it has drifted (rule in CLAUDE.md).
      - name: dependencies.txt is current
        run: python3 scripts/gen_dependencies.py --check

      # frontend/lib/api.ts is generated from the live OpenAPI schema (S0.4.2): boot the
      # API, regenerate, and fail on any diff.
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start the API
        working-directory: backend
        # Only uvicorn is backgrounded. Backgrounding `uv sync && uvicorn` as one chain would
        # race the install against the wait loop below, and a cold uv cache easily outlasts it.
        run: |
          uv run uvicorn crossbid.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the API never became ready on port 8000"
          exit 1

      - name: frontend/lib/api.ts is current
        working-directory: frontend
        # The pathspec is relative to the working directory, so it must NOT be prefixed with
        # `frontend/` here — `frontend/frontend/lib/api.ts` matches nothing and `git diff`
        # then exits 0 however stale the file is, silently voiding this whole check.
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api.ts || {
            echo "::error::frontend/lib/api.ts is stale. Run 'npm run gen:api' and commit it."
            exit 1
          }

      # Kill what this job started. Nothing else does, and a surviving uvicorn is why every
      # push from 2026-09-11 to 2026-09-14 reported a red CI while every real check was
      # green: the process outlives the job's steps, `astral-sh/setup-uv`'s post-job
      # `Pruning cache...` then blocks on the cache entries the live interpreter holds, and
      # the runner kills it after exactly five minutes with `exit code 2` — after which it
      # logs `Terminate orphan process: pid (uv)` and `pid (uvicorn)` and names the cause
      # itself. `if: always()` because a stale `api.ts` must still leave a clean runner;
      # `|| true` because `pkill` exits 1 when it matches nothing, which is a success here.
      - name: Stop the API
        if: always()
        run: pkill -f "uvicorn crossbid.main:app" || true
