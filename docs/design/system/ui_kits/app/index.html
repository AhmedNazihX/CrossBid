<!DOCTYPE html><html><head><meta charset="utf-8"><title>CrossBid — App</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--surface-canvas)}#root{display:flex;min-height:100vh}</style></head><body><div id="root"></div>
<script type="text/babel">
function App(){const [route,setRoute]=React.useState(()=>location.hash.slice(1)||'dashboard');const go=r=>{setRoute(r);location.hash=r;window.scrollTo(0,0)};
  React.useEffect(()=>{const h=()=>setRoute(location.hash.slice(1)||'dashboard');window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
  const Page={dashboard:Dashboard,runs:Runs,matrix:Matrix,verdict:Verdict}[route]||Dashboard;
  return <><Sidebar route={route} go={go}/><Frame><div data-screen-label={route}><Page go={go}/></div></Frame></>}
Object.assign(window,{App});</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{CBLoad('../..',['Icons.jsx','Shell.jsx','Dashboard.jsx','Runs.jsx','Matrix.jsx','Verdict.jsx'],()=>ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App)))});
</script></body></html>
