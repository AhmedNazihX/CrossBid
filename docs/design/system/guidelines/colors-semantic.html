<!-- @dsCard group="Colors" viewport="700x150" name="Surface & text aliases" subtitle="Use these in components, not raw scale values" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-canvas);font:var(--type-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:90px}.sw div{height:56px;border-radius:8px;border:1px solid var(--border-subtle)}.sw b{display:block;font:500 12px/1.4 var(--font-sans);margin-top:6px}.sw i{display:block;font:var(--type-mono);font-size:11px;color:var(--text-muted);font-style:normal}.lab{font:var(--type-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div style="background:var(--surface-canvas)"></div><b>surface-canvas</b><i>app bg</i></div><div class="sw"><div style="background:var(--surface-card)"></div><b>surface-card</b><i>cards</i></div><div class="sw"><div style="background:var(--surface-sunken)"></div><b>surface-sunken</b><i>row hover</i></div><div class="sw"><div style="background:var(--surface-hover)"></div><b>surface-hover</b><i>ghost hover</i></div><div class="sw"><div style="background:var(--surface-brand)"></div><b>surface-brand</b><i>primary btn</i></div><div class="sw"><div style="background:var(--surface-inverse)"></div><b>surface-inverse</b><i>dark btn</i></div></div><div style="display:flex;gap:24px;margin-top:14px;font-size:14px"><span style="color:var(--text-primary)">text-primary</span><span style="color:var(--text-secondary)">text-secondary</span><span style="color:var(--text-muted)">text-muted</span><span style="color:var(--text-placeholder)">text-placeholder</span><span style="color:var(--text-link)">text-link</span></div></body></html>
