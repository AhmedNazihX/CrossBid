<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-canvas);font:var(--type-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:90px}.sw div{height:56px;border-radius:8px;border:1px solid var(--border-subtle)}.sw b{display:block;font:500 12px/1.4 var(--font-sans);margin-top:6px}.sw i{display:block;font:var(--type-mono);font-size:11px;color:var(--text-muted);font-style:normal}.lab{font:var(--type-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:24px"><div style="text-align:center"><div style="width:100px;height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-xs)"></div><div class="lab" style="margin-top:10px">shadow-xs · cards</div></div><div style="text-align:center"><div style="width:100px;height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-sm)"></div><div class="lab" style="margin-top:10px">shadow-sm · hover</div></div><div style="text-align:center"><div style="width:100px;height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-md)"></div><div class="lab" style="margin-top:10px">shadow-md · popovers</div></div><div style="text-align:center"><div style="width:100px;height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg)"></div><div class="lab" style="margin-top:10px">shadow-lg · dialogs</div></div><div style="text-align:center"><div style="width:100px;height:64px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-focus)"></div><div class="lab" style="margin-top:10px">shadow-focus · focus ring</div></div></div></body></html>
