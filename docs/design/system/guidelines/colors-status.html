<!-- @dsCard group="Colors" viewport="700x170" name="Status colors" subtitle="Reserved for run + requirement states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-canvas);font:var(--type-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:90px}.sw div{height:56px;border-radius:8px;border:1px solid var(--border-subtle)}.sw b{display:block;font:500 12px/1.4 var(--font-sans);margin-top:6px}.sw i{display:block;font:var(--type-mono);font-size:11px;color:var(--text-muted);font-style:normal}.lab{font:var(--type-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px">
<div style="flex:1"><div style="display:flex;gap:6px;margin-bottom:8px"><div style="flex:2;height:44px;border-radius:8px;background:var(--status-success)"></div><div style="flex:1;height:44px;border-radius:8px;background:var(--status-success-bg);border:1px solid var(--border-subtle)"></div></div><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--status-success-bg);color:var(--status-success-text);font:500 12px/1 var(--font-sans)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-success)"></span>Succeeded</span><div class="lab" style="margin-top:8px">--status-success</div></div><div style="flex:1"><div style="display:flex;gap:6px;margin-bottom:8px"><div style="flex:2;height:44px;border-radius:8px;background:var(--status-warning)"></div><div style="flex:1;height:44px;border-radius:8px;background:var(--status-warning-bg);border:1px solid var(--border-subtle)"></div></div><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--status-warning-bg);color:var(--status-warning-text);font:500 12px/1 var(--font-sans)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-warning)"></span>Needs attention</span><div class="lab" style="margin-top:8px">--status-warning</div></div><div style="flex:1"><div style="display:flex;gap:6px;margin-bottom:8px"><div style="flex:2;height:44px;border-radius:8px;background:var(--status-danger)"></div><div style="flex:1;height:44px;border-radius:8px;background:var(--status-danger-bg);border:1px solid var(--border-subtle)"></div></div><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--status-danger-bg);color:var(--status-danger-text);font:500 12px/1 var(--font-sans)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-danger)"></span>Failed</span><div class="lab" style="margin-top:8px">--status-danger</div></div><div style="flex:1"><div style="display:flex;gap:6px;margin-bottom:8px"><div style="flex:2;height:44px;border-radius:8px;background:var(--status-info)"></div><div style="flex:1;height:44px;border-radius:8px;background:var(--status-info-bg);border:1px solid var(--border-subtle)"></div></div><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--status-info-bg);color:var(--status-info-text);font:500 12px/1 var(--font-sans)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-info)"></span>In progress</span><div class="lab" style="margin-top:8px">--status-info</div></div><div style="flex:1"><div style="display:flex;gap:6px;margin-bottom:8px"><div style="flex:2;height:44px;border-radius:8px;background:var(--status-neutral)"></div><div style="flex:1;height:44px;border-radius:8px;background:var(--status-neutral-bg);border:1px solid var(--border-subtle)"></div></div><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--status-neutral-bg);color:var(--status-neutral-text);font:500 12px/1 var(--font-sans)"><span style="width:7px;height:7px;border-radius:50%;background:var(--status-neutral)"></span>Queued</span><div class="lab" style="margin-top:8px">--status-neutral</div></div></div></body></html>
