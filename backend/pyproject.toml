[project]
name = "crossbid"
version = "0.1.0"
description = "Cross-border EU tender go/no-go qualification agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",       # multipart uploads (S2.2.3)
    # config and contracts
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # database, vectors, checkpoints
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    # llm access (OpenRouter via the OpenAI-compatible route)
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    # ingestion
    "pymupdf4llm>=0.0.17",
    "supabase>=2.9",                  # Storage only: upload + signed URLs (S2.2.2)
    # observability
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",   # 80% coverage gate in CI (S0.1.4); approved by the user 2026-09-10
]

[tool.uv]
package = false

[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = ["scripts/spike_extract.py"]   # disposable, deleted at S3.2.1

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",    # assert is fine in tests
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]     # hard-coded fake secrets in fixtures

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["crossbid"]
exclude = ["scripts/spike_extract.py", ".venv"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external services or an LLM; excluded from the default run",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["crossbid"]
branch = true

[tool.coverage.report]
# The spike is disposable and excluded from coverage (SP.1); scripts are entry points.
omit = ["scripts/*", "tests/*"]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
