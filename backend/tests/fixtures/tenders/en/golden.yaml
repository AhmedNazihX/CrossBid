# =============================================================================
#  VERIFIED SCORING REFERENCE. Adjudicated by a human on 2026-09-13 (S6.4, ADR-0020).
#
#  Every label below was drafted by an LLM (Claude, Opus 5) reading the parsed
#  PDF text and then read by a person, who corrected the judgement calls: the category / kind /
#  stage / checkable assignments, the thresholds and the requirement/conditional
#  split are all machine drafts. Only the `quote` fields are mechanically
#  guaranteed (see `method`); the *meaning* attached to each quote is not.
#
#  S6.4 is closed for this file: see `meta.verified_by` / `verified_on` below and
#  `VERIFICATION.md` beside it. There is no recall report for this tender -- the
#  live extraction test is DE-only -- so it was verified by reading.
# =============================================================================

meta:
  ted_publication_number: "606362-2026"
  fixture_dir: tests/fixtures/tenders/en
  source_language: en
  labelled_by: llm_assisted_human_verified
  verified_by: Ahmed Nazih Ali
  verified_on: 2026-09-13
  labelled_on: 2026-09-11
  story: S6.4
  method: |
    **Verified 2026-09-13 by Ahmed Nazih Ali**, by reading — there is no recall report for this
    tender, because the live extraction test is DE-only. The worksheet and every decision are in
    `VERIFICATION.md` beside this file.

    The four rulings made while verifying the DE key were applied here as patterns. One matched
    and was **deliberately answered the other way**. EN-017's quote is narration -- "The objective
    of the exclusion criteria is to assess whether ..." -- which on the DE key would have made it
    `informational`. It stays `mandatory` here because the situation inverts: in DE the bidder's
    real duty was labelled separately as the Eigenerklärung, so dropping the statute lost nothing,
    whereas the nine lettered situations of Art. 138(1) and five further declarations live in
    `Annex_2_*.docx`, which the PDF-only parser cannot page-anchor. EN-017 is the only
    representation in this key of **14 real requirements**; making it informational would have the
    key assert that this tender has no exclusion requirements at all. Page 17 was searched for a
    sentence stating the duty rather than the objective; the PDF contains none.

    **Zero criterion ids, deliberately.** EASA procures under Art. 138 of the Financial
    Regulation and Tender Specifications p.18 fn.12 says the ESPD may not be used, so there is no
    equivalence to record. This fixture is the control case for degrading honestly rather than
    inventing one.

    **Known and accepted limitation:** per-ground exclusion recall is not scorable here while the
    parser is PDF-only. Reading `.docx` is S2.1.2 (stretch); labelling the annexes without page
    anchors would break the verbatim guarantee the whole key rests on. The DE fixture covers
    exclusion grounds thoroughly (52 labels), so this is recorded rather than worked around.

    How these labels were produced, exactly.

    1. Every PDF in `tests/fixtures/tenders/en/` and `.../en/documents/` was read
       with the repository's own parser, `crossbid.ingestion.pymupdf_parser.PyMuPDFParser`
       (pymupdf4llm, `page_chunks=True`, one entry per page, `.strip()`ed), so the
       `page` numbers here are the page numbers extraction will see. Six PDFs,
       138 pages, zero unread pages: notice 5 pp, Invitation 5 pp, Tender
       Specifications 50 pp / 106 302 chars, Draft Framework Service Contract 50 pp,
       Appendix 2 10 pp, Appendix 3 15 pp, Annex 9 3 pp.
    2. Every `quote` is a LITERAL SUBSTRING of that parser's output for the cited
       page — not of `page.get_text()`, and not of the PDF as a human reads it.
       That distinction is load-bearing here, because EASA states its selection
       criteria in TABLES, and pymupdf4llm renders a table cell's internal line
       breaks as the literal string `<br>` and bold runs as `**`. Several quotes
       below therefore contain `<br>` or `**` inside them. That is not corruption
       and must not be "cleaned up": it is exactly the text an extractor will see,
       and removing it would make the quote fail a verbatim check. Where the
       artefact could be avoided without losing the clause the quote was trimmed
       instead. No quote was retyped, reflowed or re-spaced. Each was re-checked
       against the parsed page by script after the file was written, and the file
       must parse with `pyyaml`.
    3. `summary` is English because the source is English; it restates, it does not
       translate.
    4. eCertis: EVERY row is `null`, deliberately and not for lack of trying. This
       procedure runs under Article 138 of the EU Financial Regulation
       (Reg. (EU, Euratom) 2024/2509), not Directive 2014/24/EU, and the Tender
       Specifications say in footnote 12 on page 18 that "The European Single
       Procurement Document (ESPD) may not be used yet in calls for tenders of the
       European Union Aviation Safety Agency (EASA)". Art. 138's grounds overlap
       Art. 57's but are not the same set — (e) deficiencies in an EU-financed
       commitment, (i) resisting an audit, and the EDES database have no Art. 57
       equivalent — so no id is determinate and eCertis cannot map this tender.
       This fixture is the control case for exactly that: the matrix must degrade
       to an honest "insufficient evidence" rather than invent an equivalence.
    5. KNOWN GAP, for the verifier to rule on, and it is the biggest one in this
       file. Per the fixture's SOURCES.md the pack carries 20 criteria, of which
       14 are exclusion criteria — and all 14 are enumerated in
       `documents/Annex_2_Declaration_on_Honour_exclusion_and_selection_criteria_V1.docx`,
       which is a .docx. The repository parser (S2.1.1) is PDF-only, so no
       page-anchored, verifiable quote can be taken from it, and the 14 grounds are
       therefore NOT labelled one by one here. They enter this file only through
       the umbrella obligations quoted from Tender Specifications §3.1 (EN-012,
       EN-013, EN-014). Per-ground exclusion recall for this fixture cannot be
       scored until either the schema admits a non-PDF source or the pack's .docx
       files are parsed. That is a decision for a human, not for this draft.
    6. Scope follows SP.1 (`backend/scripts/spike_golden_de.yaml`): the base case is
       a single bidder submitting alone. Obligations that bind only a joint tender,
       a group leader, an identified subcontractor, or an entity on whose capacity
       the tenderer relies are listed under `conditional_not_scored`, not scored.
  # These two lists partition the fixture's PDFs (the pack plus the notice one level
  # up) and are validated to do so. They name PDFs only, so the pack's three non-PDF
  # files appear in neither: `Annex_2_Declaration_on_Honour_exclusion_and_selection_criteria_V1.docx`
  # (all 14 exclusion grounds), `Annexes_3-8_V1.docx` (Annex 7 T3 statement, Annex 8 F1
  # form) and `Annex_6_Model_Financial_Offer_V1.xlsx`. All three are requirement-bearing
  # and none is labelled, because the PDF-only parser cannot page-anchor them — method
  # step 5, and the first thing a verifier should rule on.
  documents_scanned:
    - Invitation_to_tender_V1.pdf
    - Tender_Specifications_V1.pdf
    - Annex_9_Simulation_exercise_V1.pdf
  documents_excluded:
    606362-2026.notice.en.pdf: "Read in full. eForms notice; §2.1.6 and §5.1.9 both answer 'Procurement Document' and it states no exclusion or selection criterion at all (ADR-0006). Its deadline and language fields restate the Invitation and Tender Specifications, labelled there."
    Draft_Framework_Service_Contract_V1.pdf: "Read in full (50 pp). Terms binding the signed contractor throughout; it creates no bid-eligibility obligation of its own."
    Appendix_2_to_the_Draft_Framework_Service_Contract_V1.pdf: "Read in full. Security requirements for contractors during performance; its bid-stage effect is selection criterion T3, quoted from the Tender Specifications (EN-036)."
    Appendix_3_to_the_Draft_Framework_Service_Contract_V1.pdf: "Read in full. EASA security baseline for external connections during performance; same as Appendix 2 — reaches the bid stage only through T3."

