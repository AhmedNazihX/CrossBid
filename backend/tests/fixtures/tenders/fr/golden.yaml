    page: 9
    quote: "Dans ce cas, il doit produire pour chacun des opérateurs les mêmes documents et renseignements qui lui sont demandés, ainsi qu’un engagement écrit de ceux-ci justifiant de leurs capacités pour l’exécution des prestations."
    summary: "A bidder relying on another operator's capacity must supply that operator's documents plus its written commitment."
    ecertis_criterion_id: null
    threshold: null
    notes: "Capacity lending only."

