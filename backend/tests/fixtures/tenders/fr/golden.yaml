  story: S6.4
  method: |
    **Verified 2026-09-13 by Ahmed Nazih Ali**, by reading — there is no recall report for this
    tender, because the live extraction test is DE-only. The worksheet and every decision are in
    `VERIFICATION.md` beside this file.

    The four rulings made while verifying the DE key were applied here as patterns, and **only
    one matched**: FR-021 to FR-024, the banded selection criteria ("Critère n°N ... noté sur 3"),
    are the analogue of the `Kriterienkatalog Leistung` criteria -- scored, not pass/fail -- and
    moved to `kind: optional`. Denominator 34 -> 30.

    **FR-025 stays `mandatory`**: "Les candidats n'ayant pas obtenu la note de 5/10 ... sont
    éliminés" is the elimination gate, the analogue of the DE A-Kriterien, a threshold *on* points
    that excludes a candidate. Its recorded limitation stands -- `ThresholdUnit` has no `POINTS`
    member and `PERCENT` would misrepresent a 5-of-10 sum, so it carries no typed threshold and a
    scorer cannot check it numerically.

    **The eight criterion ids were read off the buyer's published `DUME_acheteur.xml`, never
    inferred**, and all 30 `ccv:Criterion` UUIDs in that file are members of the generated
    `EcertisCriterionId` enum -- an independent confirmation of ADR-0007. This is therefore the
    fixture on which the cross-border wedge can be demonstrated; the DE tender publishes no DUME
    and its extraction carries no criterion id at all.

    How these labels were produced, exactly.

    1. Every PDF in `tests/fixtures/tenders/fr/` and `.../fr/documents/` was read
       with the repository's own parser, `crossbid.ingestion.pymupdf_parser.PyMuPDFParser`
       (pymupdf4llm, `page_chunks=True`, one entry per page, `.strip()`ed), so the
       `page` numbers here are the page numbers extraction will see. The RC parses
       to 20 pages / 56 045 characters and the notice to 5 pages / 9 671 characters,
       with zero unread pages in either.
    2. Every `quote` is a LITERAL SUBSTRING of that parser's output for the cited
       page — not of `page.get_text()`, and not of the PDF as a human reads it.
       The two differ: pymupdf4llm renders emphasis as markdown, so a bolded run
       arrives as `**...**`, an underlined run as `<u>...</u>`, and a table cell
       break as `<br>`. Where such an artefact falls inside a clause the quote was
       trimmed to a clean span rather than reflowed; no quote was ever retyped,
       re-spaced, or translated. Each quote was re-checked against the parsed page
       by script after the file was written, and the file must parse with `pyyaml`.
       English appears only in `summary` and `notes`.
    3. The English `summary` lines were written by the same LLM from the French
       source. They are a convenience, not a translation of record.
    4. eCertis mapping — this is the one part of this file that is NOT inference.
       `documents/DUME_acheteur.xml` is the buyer's own pre-filled ESPD request
       (`espd-req:ESPDRequest`, ESPDRequest-1). It declares 30 `ccv:Criterion`
       elements, and all 30 of their `cbc:ID` values were checked at drafting time
       against `crossbid.models.ecertis_criteria.EcertisCriterionId`: 30 of 30 are
       members of the EU-level Literal. So where this tender's prose asks for a
       thing the buyer has also declared as an ESPD criterion, the criterion id is
       READ OFF THE BUYER'S OWN DUME, not guessed — those rows say so in `notes`
       ("from DUME"). Eight rows carry an id on that basis. No id was assigned by
       inference anywhere in this file; every other row is `null` on purpose,
       because a wrong id makes S3.3.1 fetch the wrong national evidence.
       The six selection criteria the DUME declares are: chiffre d'affaires annuel
       général (499efc97), ratios financiers (e4d37adc), assurance contre les
       risques professionnels (7604bd40), effectifs moyens annuels (1f49b3f0),
       principaux services fournis antérieurement (5e506c16), certificats
       d'assurance de la qualité (d726bac9). The other 24 are exclusion grounds.
    5. KNOWN GAP, for the verifier to rule on: the DUME is XML and has no pages,
       so nothing is quoted from it and its 24 declared exclusion grounds are NOT
       labelled one by one here. They enter the file only through RC page 10, which
       incorporates them wholesale ("n'entre dans aucun des motifs d'exclusion ...
       articles L.2141-1 et suivants"), and through the two attributaire
       certificates on page 17. If the golden set is meant to score per-ground
       exclusion recall for France, this schema needs a source that is not a PDF
       page, and that is a decision for a human, not for this draft.
    6. Scope follows SP.1 (`backend/scripts/spike_golden_de.yaml`): the base case is
       a single bidder submitting alone. Obligations that bind only a groupement
       momentané d'opérateurs économiques, an operator whose capacity is borrowed,
       or a sous-traitant are listed under `conditional_not_scored`, not scored.
