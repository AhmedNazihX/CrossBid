# Obligations that bind only a groupement momentané d'opérateurs économiques, an
# operator whose capacity the bidder borrows, or a sous-traitant. Out of scope for
# the base case (a single bidder submitting alone), kept so a later run can score
# them. Each line names the RC page it is on.
conditional_not_scored:
  - id: FR-C01
    category: formal
    kind: mandatory
    stage: bid_eligibility
    checkable: document_submission
    doc: 26023_AOO_Conseil_Architecure_SI_RC_v1.pdf
    page: 8
    quote: "Remarque : si le candidat se présente sous la forme d’un groupement momentané d’entreprises, chaque membre du groupement doit fournir les pièces et documents mentionnés ci-après."
    summary: "In a consortium, every member must supply the candidature documents; capacity is assessed globally."
    ecertis_criterion_id: null
    threshold: null
    notes: "Groupement only."

  - id: FR-C02
    category: formal
    kind: mandatory
    stage: bid_eligibility
