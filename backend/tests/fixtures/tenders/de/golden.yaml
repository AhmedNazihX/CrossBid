#  Every label below was drafted by an LLM (Claude, Opus 5) reading the parsed PDFs.
#  NO HUMAN HAS CHECKED THE JUDGEMENT CALLS YET: the category, kind, stage, checkability,
#  threshold and eCertis mapping on each row are a proposal, not a finding. Do not use
#  this file to score extraction (S3.2.3) or to report a recall number until a person has
#  read it and `verified_by` names them.
#
#  What *is* mechanically guaranteed, by `tests/unit/test_golden_labels.py`: every `doc`
#  exists in the pack, every `page` is inside it, and every `quote` literally occurs on
#  the page it cites under the extractor's own normalisation. A fabricated quote or a
#  wrong page cannot be committed. What a machine cannot check is whether an obligation
#  was *missed*, and whether the judgement fields are right.
#
#  Second pass, 2026-09-12: DE-300 and above were adjudicated from a LIVE RUN OF THE
#  SYSTEM UNDER TEST, plus an independent sweep that is the control on that circularity.
#  Read the `method` field before quoting any recall figure computed against this file.
#
#  Closed by: S6.4 (this file's human-verification half). Supersedes
#  `scripts/spike_golden_de.yaml` (SP.1), which it does not contradict except where noted
#  in `notes:` -- see the header's `method` for the three places SP.1 is wrong.
# =====================================================================================

