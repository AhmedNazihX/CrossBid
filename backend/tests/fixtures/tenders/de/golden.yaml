  story: S6.4
  method: |
    Drafted by an LLM (Claude Opus 5) on 2026-09-11, from the text the repo's own
    `PyMuPDFParser` produces -- not from the raw PDFs and not from `page.get_text()`.
    That matters: `pymupdf4llm` returns markdown, so a bold clause arrives as
    `**mindestens 29 VZAE**` and a table cell arrives with literal `<br>` between its
    lines. Quotes here are copied out of that markdown, and the validator compares them
    with `extract_reqs._is_verbatim`, which strips inline `*_` runs and collapses
    whitespace but does NOT strip `<br>`, `<sup>` or `<u>`. Where a sentence is broken by
    one of those tags the quote is the longest unbroken span of the clause rather than
    the whole sentence; those rows say so in `notes`.

    Procedure: all 28 PDFs in `documents/` (191 pages) plus the 11-page TED notice one
    level up were parsed and read in full. Each document was then classified as bearing a
    bidder requirement or not; `documents_excluded` records every exclusion with its
    reason, so no file was passed over silently. For each distinct obligation one entry
    was written with a verbatim source-language quote, an English one-line summary, and
    the typed fields of `crossbid.models.requirement`.

    eCertis mapping is deliberately sparse. An id is set only where the correspondence is
    determinate -- mostly where the TED notice itself names the ESPD criterion (BT-750
    "Spezifischer Jahresumsatz", "Durchschnittliche jaehrliche Belegschaft", "Referenzen
    zu bestimmten Dienstleistungen") or where a GWB paragraph maps one-to-one onto an
    Art. 57 ground. Where one sentence covers several ESPD criteria (the combined
    environmental/social/labour question, the combined taxes-and-social-security ground)
    the field is null and the candidates are named in `notes`: S3.3.1 fetches national
    evidence for whatever id is written here, so a wrong id is worse than none.

    Scope, inherited from SP.1: the base case is a single bidder submitting alone.
    Obligations that bind only a Bietergemeinschaft, an Eignungsleihe, a subcontractor or
    a multi-lot bid are in `conditional_not_scored`, not `requirements`.

    Deliberately included beyond SP.1: `contract_performance` rows (insurance, ILO
    compliance, e-invoicing, personnel deployment). They are NOT noise -- ADR-0003's
    stage discriminator is what keeps them out of the matrix, and having them labelled is
    the only way S3.2.3 can score that filter in both directions. A scorer measuring
    extraction recall must filter this file on `stage: bid_eligibility` first.

    Three corrections to SP.1 (`scripts/spike_golden_de.yaml`), all verified here:
    (1) SP.1's FIN-02 quote contains a `[...]` elision marker and is therefore not
    verbatim -- it cannot pass a substring check against any page. Split into DE-061 and
    DE-062. (2) SP.1's EXCL-02 and EXCL-03 quotes join text across a markdown table
    boundary; under the repo's parser those cells are separated by a literal `<br>` or sit
    in different cells, so neither quote occurs on the cited page. Replaced by DE-085,
    DE-090 and neighbours, each quoting one unbroken span. (3) SP.1 labelled only three
    documents as requirement-bearing; that is wrong. The Allgemeine Bewerbungsbedingungen
    carry the language, form, deadline and Nebenangebot rules, the Rahmenvereinbarung
    carries a liability-insurance minimum, the TED notice carries the deadline and the
    ESPD criterion names, and the Kriterienkatalog Leistung and Leistungsbeschreibung
    carry the personnel prerequisites. Ten documents bear requirements, not three.

    Known gaps the verifier should treat as open: the per-Unterstuetzungsbereich
    prerequisites in the Kriterienkatalog Leistung (Ziffern 1.4.1.1, 1.5.1.1, 1.6.1.1)
    and the long content-bullet catalogues under each B-Kriterium are NOT exploded into
    one entry per bullet; the equivalent obligations are labelled once from the
    Leistungsbeschreibung's Erfahrungsstufen (DE-250..DE-253). The `Erklaerung zur
    sozialen Nachhaltigkeit von IT` document catalogue (pages 8-16) is represented by one
    entry rather than one per ILO norm.
