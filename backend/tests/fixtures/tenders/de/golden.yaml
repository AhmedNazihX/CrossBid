  method: |
    **Verified 2026-09-13 by Ahmed Nazih Ali**, against the live DE extraction of 2026-09-12
    scored by `scripts/recall.py`. The worksheet and every decision are in `VERIFICATION.md`
    beside this file. What a person actually adjudicated, rather than what a machine had
    already proved:

    - the two label/row pairs the matcher rejected on high overlap (both upheld as misses);
    - whether the key may carry eCertis criterion ids the extractor is forbidden to infer
      (kept -- the 16 disagreements are expected, not defects);
    - the three `kind` clusters, of which one moved: the `Kriterienkatalog Leistung` criteria
      are scored, not pass/fail;
    - a sample of the misses, which generalised into seven labels that quote the recitation of
      the law or a notice metadata field rather than a duty on the bidder.

    The machine half was never in question and was not re-checked by hand:
    `test_golden_labels.py` re-opens every cited PDF and asserts every quote appears verbatim on
    its cited page, that every criterion id is a real member of the generated enum, and that
    `documents_scanned` and `documents_excluded` partition the pack exactly.

    Recall against that run moved 0.77 -> 0.73 -> 0.75 across the rulings. **None of that is
    extraction changing** -- only the denominator moved, twice, for recorded reasons. The figure
    still fails the 0.90 threshold.

    2026-09-13, user verification of the spot-check sample (S6.4 §4): six labels whose quote is
    the *recitation of the law* rather than a duty on the bidder moved to `kind: informational`
    and left the scored set -- DE-360/361/362 (the § 299 StGB, § 108e StGB and IntBestG entries
    inside one exclusion ground's list of offences), DE-363 ("2) die öffentlichen Auftraggeber
    ... nachweisen können", the sub-clause on how the buyer may prove it), DE-107 (the statutory
    text of the tax/social-security ground) and DE-376 (the Russia-sanctions annex reference).
    The bidder's actual duty in each case is the Eigenerklärung, which is labelled separately;
    counting the statute as well double-counted one obligation as several. Denominator 184 -> 178.

    2026-09-13, user ruling on the `Kriterienkatalog Leistung`: its criteria are **scored,
    not pass/fail**. Missing one costs Leistungspunkte; it does not exclude the offer. So 35
    labels from that catalogue moved from `kind: mandatory` to `kind: optional` and left the
    scored set (denominator 219 -> 184, recall 0.77 -> 0.73 -- the figure went *down*, which
    is the point: the ruling was made on what the tender means, not on the score).

    The **11 A-Kriterien in the same catalogue stay `mandatory`**. They read like scoring but
    are not: "Das Angebot muss im B-Kriterium B 1.3 ... mindestens 80 Punkte erreichen" is a
    threshold *on* points, and an offer below it is excluded. A-Kriterium wording is the
    marker (`A 1.1`, `A 2.5`); B-Kriterien earn points and are now optional.

    Drafted by an LLM (Claude Opus 5) on 2026-09-11, from the text the repo's own
    `PyMuPDFParser` produces -- not from the raw PDFs and not from `page.get_text()`.
    That matters: `pymupdf4llm` returns markdown, so a bold clause arrives as
    `**mindestens 29 VZAE**` and a table cell arrives with literal `<br>` between its
    lines. Quotes here are copied out of that markdown, and the validator compares them
    with `extract_reqs._is_verbatim`, which strips inline `*_` runs and collapses
    whitespace but does NOT strip `<br>`, `<sup>` or `<u>`. Where a sentence is broken by
    one of those tags the quote is the longest unbroken span of the clause rather than
    the whole sentence; those rows say so in `notes`.

    Procedure: all 28 PDFs in `documents/` (191 pages) plus the 11-page TED notice one
    level up were parsed and read in full. Each document was then classified as bearing a
    bidder requirement or not; `documents_excluded` records every exclusion with its
    reason, so no file was passed over silently. For each distinct obligation one entry
    was written with a verbatim source-language quote, an English one-line summary, and
    the typed fields of `crossbid.models.requirement`.

    eCertis mapping is deliberately sparse. An id is set only where the correspondence is
    determinate -- mostly where the TED notice itself names the ESPD criterion (BT-750
    "Spezifischer Jahresumsatz", "Durchschnittliche jaehrliche Belegschaft", "Referenzen
    zu bestimmten Dienstleistungen") or where a GWB paragraph maps one-to-one onto an
    Art. 57 ground. Where one sentence covers several ESPD criteria (the combined
    environmental/social/labour question, the combined taxes-and-social-security ground)
    the field is null and the candidates are named in `notes`: S3.3.1 fetches national
    evidence for whatever id is written here, so a wrong id is worse than none.

    Scope, inherited from SP.1: the base case is a single bidder submitting alone.
    Obligations that bind only a Bietergemeinschaft, an Eignungsleihe, a subcontractor or
    a multi-lot bid are in `conditional_not_scored`, not `requirements`.

    Deliberately included beyond SP.1: `contract_performance` rows (insurance, ILO
    compliance, e-invoicing, personnel deployment). They are NOT noise -- ADR-0003's
    stage discriminator is what keeps them out of the matrix, and having them labelled is
    the only way S3.2.3 can score that filter in both directions. A scorer measuring
    extraction recall must filter this file on `stage: bid_eligibility` first.

    Three corrections to SP.1 (`scripts/spike_golden_de.yaml`), all verified here:
    (1) SP.1's FIN-02 quote contains a `[...]` elision marker and is therefore not
    verbatim -- it cannot pass a substring check against any page. Split into DE-061 and
    DE-062. (2) SP.1's EXCL-02 and EXCL-03 quotes join text across a markdown table
    boundary; under the repo's parser those cells are separated by a literal `<br>` or sit
    in different cells, so neither quote occurs on the cited page. Replaced by DE-085,
    DE-090 and neighbours, each quoting one unbroken span. (3) SP.1 labelled only three
    documents as requirement-bearing; that is wrong. The Allgemeine Bewerbungsbedingungen
    carry the language, form, deadline and Nebenangebot rules, the Rahmenvereinbarung
    carries a liability-insurance minimum, the TED notice carries the deadline and the
    ESPD criterion names, and the Kriterienkatalog Leistung and Leistungsbeschreibung
    carry the personnel prerequisites. Ten documents bear requirements, not three.

    SECOND PASS, 2026-09-12 -- where DE-300 and above come from, and why the recall
    number they move must be read carefully.

    A live run of the system under test (the committed graph over this pack, 2026-09-12,
    279 requirements, $1.47; saved as `tests/fixtures/extractions/de.live.json`) was
    scored by `scripts/recall.py` against the first pass above. It returned recall 0.75
    and, more usefully, 173 CANDIDATE MISSING LABELS: rows the extractor produced that no
    label explained. Those 173 were adjudicated one by one against the parsed PDFs --
    154 accepted, 19 rejected as narration, cross-references, buyer-side procedure,
    section headings or restatements already labelled on the same page. The accepted ones
    are DE-300..DE-546 and DE-C20..DE-C48 (minus the sweep ids below).

    THE CIRCULARITY, STATED PLAINLY. Every one of those 154 rows came from the extractor's
    own output, so each accepted label adds to BOTH the numerator and the denominator of
    recall: the extractor found it by definition. Taken alone, that pass moves the figure
    upward without extraction having improved at all, and a figure moved that way means
    nothing.

    THE CONTROL. So the documents that took the most accepted labels -- Kriterienkatalog
    Leistung, Leistungsbeschreibung, the two Bewerbungsbedingungen, Kriterienkatalog
    Eignung, the two Eigenerklaerungen and Vordruck Referenzen -- were then swept
    independently for obligations that NEITHER this key NOR the extraction had. That
    sweep produced 34 further entries (their `notes` say so), 25 of them mandatory and
    bid-eligibility, and they raise only the denominator. The Leistungsbeschreibung alone
    yielded 14: its whole `Externe Hardware` personnel section (Ziffern 4.2.2/4.2.3) and
    the `Netzwerk- und Informationstechnik` minimum requirements (Ziffer 4.1.2) had been
    read by neither. The Allgemeine Bewerbungsbedingungen, by contrast, yielded exactly
    one, and that one optional: the first pass had covered that document well.

    Resolved by this pass: the per-Unterstuetzungsbereich prerequisites in the
    Kriterienkatalog Leistung (Ziffern 1.4.1.1, 1.5.1.1, 1.6.1.1) and the
    `Erklaerung zur sozialen Nachhaltigkeit von IT` document catalogue (pages 8-16) are
    now one entry per bullet rather than one entry each. Still NOT exploded: the long
    content-bullet catalogues under each B-Kriterium (the a)-e) lists of theme-area
    contents), which describe what a reference may contain rather than what the bidder
    must have.

    Deliberate stage call, worth re-reading: every bullet of the social-sustainability
    catalogue (DE-400..DE-420) is `contract_performance`, because it governs how the
    contract is performed at the production site and because the catalogue is filed only
    under Variante 1. The live extractor emitted all 21 as `bid_eligibility`, so they now
    surface as stage-filter leaks -- which is exactly what contract_performance rows are
    in this file for (ADR-0015).

    Convention used for `kind` in this pass, taken from how the first pass already used
    it: a clause binding every base-case bidder is `mandatory`; one binding only a bidder
    who takes an elective route (the prequalification database, an alternative form of
    evidence, an unfinished reference, a bidder question) is `optional`; one binding only
    a Bietergemeinschaft, an Eignungsleihe, a subcontractor or a multi-lot bid goes to
    `conditional_not_scored`.
