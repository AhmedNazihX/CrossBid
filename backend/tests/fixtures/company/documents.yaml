# Demo company pack - the page content, Story S6.3.
#
# The generator's second input, beside `profile.yaml`: `scripts/build_demo_company_pack.py`
# renders every entry here to one PDF in `documents/`. The text lives in YAML rather than in
# the script so that a reviewer reads German prose as prose, and so that the script stays an
# engine. Order matters: the documents, their pages and the blocks on a page are rendered in
# the order written here.
#
# All of it is fabricated. Each `{placeholder}` is filled from `profile.yaml` at render time,
# which is what keeps the evidence on the page and the structured facts from drifting apart;
# an unknown placeholder is a build error, never a blank.
#
# Block styles: `h` subheading, `p` paragraph, `li` bullet, `kv` label and value separated by
# a tab. `heading` is the page title.

